        <!-- JavaScript -->

        <script>
            document.getElementById("year").innerHTML = new Date().getFullYear();
            // Get the button
            let mybutton = document.getElementById("Top-scroll-Btn");

            // When the user scrolls down 20px from the top of the document, show the button
            window.onscroll = function () {
                scrollFunction();
            };

            function scrollFunction() {
                if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                    mybutton.style.display = "block";
                } else {
                    mybutton.style.display = "none";
                }
            }
            const divArray = ["f1", "f2", "f3", "f4", "f5", "f6", "f7", "f8", "f9", "f10", "f11", "f12", "f13", "f14", "f15", "f16", "f17", "f18", "f19", "f20", "f21", "f22", "f23", "f24", "f25", "f26", "f27", "f28", "f29"];
            function showDiv(index) {
                if (index >= 0 && index < divArray.length) {
                    // Hide all divs
                    // Show the selected div
                    document.getElementById(divArray[index]).style.display = "block";
                }
            }
            function remDiv(index) {
                // Show the selected div
                document.getElementById(divArray[index]).style.display = "none";
            }

            // When the user clicks on the button, scroll to the top of the document
            function topFunction() {
                document.body.scrollTop = 0;
                document.documentElement.scrollTop = 0;
                var scroll = document.getElementById("top-scroll-img");
                window.addEventListener("scroll", function () {
                    scroll.style.transform = "rotate(" + window.pageYOffset + "deg)";
                });
            }
        </script>
        <script>
            const clip = document.querySelectorAll(".clip");
            for (let i = 0; i < clip.length; i++) {
                clip[i].addEventListener("mouseover", function (e) {
                    clip[i].play();
                });
                clip[i].addEventListener("mouseout", function (e) {
                    clip[i].pause();
                });
            }
        </script>

        <script>
            // Polyfill for smooth scrolling in browsers that do not support scroll-behavior
            if (window.getComputedStyle(document.body).scrollBehavior === undefined) {
                document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
                    anchor.addEventListener("click", function (e) {
                        e.preventDefault();

                        document.querySelector(this.getAttribute("href")).scrollIntoView({
                            behavior: "smooth",
                        });
                    });
                });
            }
